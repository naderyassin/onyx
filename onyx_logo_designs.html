<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onyx Logo Designs Showcase (12 Options)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap');

    :root {
      --bg: #09090b;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --muted: #a1a1aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1.heading {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #fff;
    }

    p.subheading {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
      text-align: center;
    }

    /* Tabs */
    .switcher {
      display: flex;
      gap: 6px;
      margin-bottom: 40px;
      background: rgba(255,255,255,0.05);
      padding: 8px;
      border-radius: 16px;
      border: 1px solid var(--border);
      flex-wrap: wrap;
      justify-content: center;
      max-width: 900px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: #fff;
      background: rgba(255,255,255,0.08);
    }

    .tab-btn.active {
      background: #fff;
      color: #000;
      font-weight: 600;
    }

    /* Mockup Container */
    .mockup-frame {
      width: 100%;
      max-width: 680px;
      background: #030303;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .mockup-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none;
      opacity: 0.6;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .icon-wrapper {
      width: 84px;
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.25));
    }

    .icon-wrapper svg {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    .logo-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 42px;
      color: #ffffff;
      letter-spacing: 4px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
      margin-bottom: 24px;
    }

    .tagline-box {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.05);
      margin-bottom: 40px;
    }

    .tagline-box .cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: #fff;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .url-bar {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 8px 8px 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .url-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 14px;
      outline: none;
    }

    .paste-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
    }

    .fetch-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .mode-pills {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      position: relative;
      z-index: 1;
    }

    .pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
    }

    .pill.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <h1 class="heading">Onyx Header Logo Design Options</h1>
  <p class="subheading">Exact retro white text & tagline with 12 real pixel SVG icon designs</p>

  <div class="switcher">
    <button class="tab-btn" id="btn-gem" onclick="switchDesign('gem')">💎 1. Onyx Gem</button>
    <button class="tab-btn" id="btn-floppy" onclick="switchDesign('floppy')">💾 2. Floppy Vault</button>
    <button class="tab-btn" id="btn-portal" onclick="switchDesign('portal')">🌀 3. Portal Ring</button>
    <button class="tab-btn" id="btn-satellite" onclick="switchDesign('satellite')">📡 4. Satellite</button>
    <button class="tab-btn" id="btn-vhs" onclick="switchDesign('vhs')">📼 5. VHS Tape</button>
    <button class="tab-btn" id="btn-lightning" onclick="switchDesign('lightning')">⚡ 6. Power Spark</button>
    <button class="tab-btn" id="btn-ufo" onclick="switchDesign('ufo')">🛸 7. UFO Beam</button>
    <button class="tab-btn" id="btn-key" onclick="switchDesign('key')">🗝️ 8. Master Key</button>
    <button class="tab-btn" id="btn-film" onclick="switchDesign('film')">🎬 9. Film Reel</button>
    <button class="tab-btn" id="btn-shield" onclick="switchDesign('shield')">🛡️ 10. Safe Shield</button>
    <button class="tab-btn" id="btn-rocket" onclick="switchDesign('rocket')">🚀 11. Rocket Boost</button>
    <button class="tab-btn" id="btn-crown" onclick="switchDesign('crown')">👑 12. Arcade Crown</button>
  </div>

  <div class="mockup-frame">
    <div class="logo-container">
      
      <!-- Icon Wrapper -->
      <div class="icon-wrapper" id="iconDisplay">
        <!-- SVG injected by JS -->
      </div>

      <!-- Exact Retro White Typography -->
      <div class="logo-text">ONYX</div>

      <!-- Boxed Terminal Tagline -->
      <div class="tagline-box">
        <span>&gt; Save the internet, beautifully.</span>
        <span class="cursor"></span>
      </div>

    </div>

    <!-- Download Link Input Bar -->
    <div class="url-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" class="url-input" value="https://www.youtube.com/watch?v=..." readonly>
      <button class="paste-btn">Paste</button>
      <button class="fetch-btn">Download</button>
    </div>

    <div class="mode-pills">
      <div class="pill active">Auto</div>
      <div class="pill">Video</div>
      <div class="pill">Audio</div>
    </div>
  </div>

  <script>
    const designs = {
      // 1. Onyx Crystal Gem
      gem: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">

        <polygon points="32,6 52,22 44,56 20,56 12,22" fill="#121215" stroke="white" stroke-width="3" stroke-linejoin="bevel"/>
        <line x1="32" y1="6" x2="32" y2="56" stroke="white" stroke-width="2"/>
        <line x1="12" y1="22" x2="52" y2="22" stroke="white" stroke-width="2"/>
        <line x1="32" y1="22" x2="20" y2="56" stroke="white" stroke-width="2"/>
        <line x1="32" y1="22" x2="44" y2="56" stroke="white" stroke-width="2"/>

      // 2. Retro Floppy Disk

        <rect x="12" y="8" width="40" height="48" rx="4" fill="#0d0d10" stroke="white" stroke-width="3"/>
        <rect x="20" y="8" width="24" height="18" fill="#1e1e24" stroke="white" stroke-width="2"/>
        <rect x="34" y="12" width="6" height="10" fill="white"/>
        <rect x="18" y="32" width="28" height="24" fill="#18181c" stroke="white" stroke-width="2"/>
        <path d="M32 36 V48 M27 43 L32 48 L37 43" stroke="white" stroke-width="3" stroke-linecap="square"/>
      </svg>`,

      // 3. Cosmic Portal Vortex
      portal: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="24" stroke="white" stroke-width="3" stroke-dasharray="6 4"/>
        <circle cx="32" cy="32" r="16" stroke="white" stroke-width="2" opacity="0.6"/>
        <path d="M32 18 V42 M24 34 L32 42 L40 34" stroke="white" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>
        <path d="M8 8H12V12H8V8ZM54 52H58V56H54V52Z" fill="white"/>
      </svg>`,

      // 4. Satellite Receiver Dish
      satellite: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 26 C14 44, 50 44, 50 26" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>
        <line x1="32" y1="35" x2="32" y2="48" stroke="white" stroke-width="3"/>
        <line x1="22" y1="48" x2="42" y2="48" stroke="white" stroke-width="3"/>
        <line x1="32" y1="26" x2="32" y2="14" stroke="white" stroke-width="2"/>
        <circle cx="32" cy="14" r="3" fill="white"/>
        <path d="M32 4 V10 M26 7 L32 10 L38 7" stroke="white" stroke-width="2"/>
        <path d="M8 12H12V16H8V12ZM50 14H54V18H50V14Z" fill="white"/>
      </svg>`,

      // 5. VHS Cassette Tape
      vhs: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="8" y="14" width="48" height="36" rx="4" fill="#0c0c0f" stroke="white" stroke-width="3"/>
        <circle cx="22" cy="32" r="7" stroke="white" stroke-width="2"/>
        <circle cx="42" cy="32" r="7" stroke="white" stroke-width="2"/>
        <line x1="29" y1="32" x2="35" y2="32" stroke="white" stroke-width="2"/>
        <path d="M32 38 V48 M28 44 L32 48 L36 44" stroke="white" stroke-width="2"/>
        <path d="M8 10H12V14H8V10ZM52 8H56V12H52V8Z" fill="white"/>
      </svg>`,

      // 6. Power Lightning Spark
      lightning: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="36,4 20,30 32,30 26,60 46,28 34,28" fill="white"/>
        <path d="M10 16H14V20H10V16ZM50 18H54V22H50V18Z" fill="white"/>
      </svg>`,

      // 7. UFO Beam Down
      ufo: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="32" cy="18" rx="12" ry="7" fill="#18181c" stroke="white" stroke-width="2"/>
        <ellipse cx="32" cy="24" rx="22" ry="6" fill="#0d0d10" stroke="white" stroke-width="3"/>
        <circle cx="20" cy="24" r="1.5" fill="white"/>
        <circle cx="32" cy="24" r="1.5" fill="white"/>
        <circle cx="44" cy="24" r="1.5" fill="white"/>
        <polygon points="24,30 40,30 48,58 16,58" fill="none" stroke="white" stroke-width="2" stroke-dasharray="4 3"/>
        <path d="M32 34 V48 M27 43 L32 48 L37 43" stroke="white" stroke-width="3"/>
      </svg>`,

      // 8. Master Key Unlocker
      key: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="10" stroke="white" stroke-width="3" fill="#121215"/>
        <circle cx="20" cy="20" r="4" stroke="white" stroke-width="2"/>
        <line x1="27" y1="27" x2="48" y2="48" stroke="white" stroke-width="4"/>
        <line x1="42" y1="42" x2="47" y2="37" stroke="white" stroke-width="3"/>
        <line x1="46" y1="46" x2="51" y2="41" stroke="white" stroke-width="3"/>
        <path d="M42 54 L52 54 L52 44" stroke="white" stroke-width="3"/>
      </svg>`,

      // 9. Film Reel Spool
      film: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="28" r="20" stroke="white" stroke-width="3" fill="#101014"/>
        <circle cx="32" cy="28" r="5" fill="white"/>
        <circle cx="23" cy="20" r="3.5" stroke="white" stroke-width="2"/>
        <circle cx="41" cy="20" r="3.5" stroke="white" stroke-width="2"/>
        <circle cx="23" cy="36" r="3.5" stroke="white" stroke-width="2"/>
        <circle cx="41" cy="36" r="3.5" stroke="white" stroke-width="2"/>
        <path d="M32 42 V54 M26 48 L32 54 L38 48" stroke="white" stroke-width="3" stroke-linecap="square"/>
      </svg>`,

      // 10. Safe Vault Shield
      shield: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 8 L52 14 V32 C52 46, 32 56, 32 56 C32 56, 12 46, 12 32 V14 L32 8Z" stroke="white" stroke-width="3" fill="#101014"/>
        <path d="M32 20 V38 M25 32 L32 38 L39 32" stroke="white" stroke-width="3" stroke-linecap="square"/>
      </svg>`,

      // 11. Rocket Booster
      rocket: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 6 C32 6 44 18 44 36 L32 44 L20 36 C20 18 32 6 32 6Z" stroke="white" stroke-width="3" fill="#121216"/>
        <circle cx="32" cy="22" r="4" stroke="white" stroke-width="2"/>
        <path d="M16 36 L10 44 H20" stroke="white" stroke-width="2"/>
        <path d="M48 36 L54 44 H44" stroke="white" stroke-width="2"/>
        <path d="M32 46 V58 M27 52 L32 58 L37 52" stroke="white" stroke-width="3"/>
      </svg>`,

      // 12. Arcade Crown
      crown: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="10,48 14,20 26,34 32,12 38,34 50,20 54,48" stroke="white" stroke-width="3" fill="#121216" stroke-linejoin="round"/>
        <line x1="10" y1="48" x2="54" y2="48" stroke="white" stroke-width="3"/>
        <circle cx="14" cy="18" r="2.5" fill="white"/>
        <circle cx="32" cy="10" r="2.5" fill="white"/>
        <circle cx="50" cy="18" r="2.5" fill="white"/>
        <path d="M32 36 V58 M26 52 L32 58 L38 52" stroke="white" stroke-width="3"/>
      </svg>`
    };

    function switchDesign(key) {
      if (!designs[key]) key = 'gem';
      document.getElementById('iconDisplay').innerHTML = designs[key];
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + key);
      if (activeBtn) activeBtn.classList.add('active');
    }

    const params = new URLSearchParams(window.location.search);
    const selected = params.get('design') || 'gem';
    switchDesign(selected);
  </script>
</body>
</html>
