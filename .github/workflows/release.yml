name: Release Windows build

# Push a version tag to ship a release, e.g.:
#   git tag v0.2.0 && git push --tags
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Build installer (electron:build handles web build, NSIS graphics, packaging, checksum)
        run: npm run electron:build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # .blockmap rides along so electron-updater can fetch a differential
          # update instead of the whole ~160MB installer.
          $assets = @(
            "public/downloads/Onyx-Setup.exe",
            "public/downloads/Onyx-Setup.exe.blockmap",
            "public/downloads/latest.yml"
          )
          # The release may already exist -- `gh release create` makes the tag,
          # so publishing one by hand fires this workflow and then collides with
          # it ("a release with the same tag name already exists"). Upload into
          # whatever is there instead of failing the run.
          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" @assets --clobber
          } else {
            gh release create "$env:TAG" @assets --title "Onyx $env:TAG" --generate-notes
          }
