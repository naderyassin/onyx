name: Release Windows build

# Push a version tag to ship a release, e.g.:
#   git tag v0.2.0 && git push --tags
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Build installer (electron:build handles web build, NSIS graphics, packaging, icon patch, CRC fix, checksum)
        run: npm run electron:build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            public/downloads/Onyx-Setup.exe `
            public/downloads/latest.yml `
            --title "Onyx ${{ github.ref_name }}" `
            --generate-notes
